# Cargo.toml
[package]
name = "ew_backup_gen"
version = "0.1.1"
edition = "2024"

[dependencies]
fs_extra = "1.3"
tokio = { version = "1.52.3", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
config = { version = "0.15.23", features = ["ini"] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.45"
dirs = "6.0.0"
ctrlc = "3.5.2"
colored = "3.1.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
semver = "1.0.28"
tempfile = "3.27.0"
zip = "8.6.0"
self-replace = "1.5.0"
serde_json = "1.0.150"

[build-dependencies]
embed-resource = "3.0.9"
